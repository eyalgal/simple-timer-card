# CUSTOMIZATION TEMPLATE: backend monitor that runs device timer actions.
# Paste context: one automation mapping for the single-automation YAML editor.
# For an automation list, prefix alias with "- " and indent the remaining
# mapping two spaces. Do not add an automation: wrapper in the editor.
#
# Runs the on_finish action of Simple Timer Card device timers (for example
# "turn off the air purifier in 30 minutes") from Home Assistant itself, so it
# works with every dashboard closed. It polls the MQTT store every 5 seconds,
# like the backend notification monitor in mqtt-hybrid-model.md.
#
# Requires: the MQTT store sensor from mqtt-hybrid-model.md step 1, a card with
# storage: mqtt and device_timers, and a dedicated 255-character Text helper
# initialized once to {"v1":true,"done":[]} (see "Device timers" in that guide).
#
# allowed_actions is the security boundary: anyone who can publish to the MQTT
# store could otherwise switch any entity. List only the entities and actions
# your cards offer. This is a convenience action, NOT a safety-critical shutoff.
alias: "Simple Timer Card: Device Timer Actions"
description: "Runs allowlisted device timer actions from the MQTT store."
trigger:
  - platform: time_pattern
    seconds: "/5"
variables:
  sensor_entity: sensor.simple_timer_store
  processed_helper: input_text.simple_timer_card_device_actions_processed
  # Entity -> actions it may run. Replace with your own entities.
  allowed_actions:
    fan.air_purifier: [turn_off]
    light.living_room: [turn_on, turn_off]
  # Skip actions that are more than 10 minutes overdue, e.g. after a long outage.
  max_late_ms: 600000
condition:
  - condition: template
    value_template: >-
      {{ states(sensor_entity) == '1'
         and state_attr(sensor_entity, 'store_valid') is sameas true
         and states(processed_helper) not in ['unknown', 'unavailable'] }}
action:
  - variables:
      records: "{{ state_attr(sensor_entity, 'timers') }}"
      snapshot_updated: "{{ state_attr(sensor_entity, 'lastUpdated') }}"
      ledger: "{{ states(processed_helper) | from_json(default=none) }}"
      now_ms: "{{ (as_timestamp(now()) * 1000) | int }}"
  - variables:
      scan: >-
        {% set ns = namespace(valid=true, ids=[], current=[], due=[]) %}
        {% if records is not sequence or records is string or records is mapping %}
          {% set ns.valid = false %}
        {% else %}
          {% for t in records %}
            {% if t is not mapping %}
              {% set ns.valid = false %}
            {% else %}
              {% set tid = t.get('id') %}
              {% set end_ts = t.get('end_ts') %}
              {% set dormant = t.get('paused', false) or t.get('idle', false)
                   or t.get('finished', false) or t.get('kind') == 'template'
                   or t.get('source') == 'template'
                   or t.get('state') in ['paused', 'idle', 'finished'] %}
              {% if tid is not string or not tid or tid in ns.ids
                    or not ((end_ts is integer and end_ts > 0)
                            or (end_ts is none and dormant)) %}
                {% set ns.valid = false %}
              {% else %}
                {% set ns.ids = ns.ids + [tid] %}
                {% set act = t.get('on_finish') %}
                {% if end_ts is integer and end_ts > 0 and act is mapping %}
                  {% set key = [tid, end_ts] %}
                  {% set ns.current = ns.current + [key] %}
                  {% set entity = act.get('entity_id') %}
                  {% set service = act.get('service') %}
                  {% if not dormant and t.get('source', 'mqtt') == 'mqtt'
                        and t.get('state', 'active') in ['active', 'expired']
                        and end_ts <= now_ms and now_ms - end_ts <= max_late_ms
                        and entity is string and service is string
                        and entity in allowed_actions
                        and service in allowed_actions[entity] %}
                    {% set ns.due = ns.due + [{'key': key, 'entity_id': entity, 'service': service}] %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ {'valid': ns.valid, 'current': ns.current, 'due': ns.due} }}
      ledger_valid: >-
        {% set ns = namespace(valid=false) %}
        {% if ledger is mapping and ledger.get('v1') is sameas true
              and ledger.get('done') is sequence
              and ledger.get('done') is not string
              and ledger.get('done') is not mapping %}
          {% set ns.valid = true %}
          {% for key in ledger['done'] %}
            {% if key is not sequence or key is string or key is mapping
                  or key | length != 2 or key[0] is not string or not key[0]
                  or key[1] is not integer or key[1] <= 0 %}
              {% set ns.valid = false %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.valid }}
  - if:
      - condition: template
        value_template: >-
          {{ not scan.valid or not ledger_valid
             or (state_attr(processed_helper, 'max') | int(0)) != 255 }}
    then:
      - service: persistent_notification.create
        data:
          notification_id: simple_timer_card_device_action_warning
          title: "Device timer monitor needs attention"
          message: >-
            No device actions ran this poll. Check {{ sensor_entity }} records
            and {{ processed_helper }} JSON/max length (must be 255).
      - stop: "Invalid records or ledger configuration; preserve claims."
  - variables:
      plan: >-
        {% set ns = namespace(kept=[], pending=[], combined=[]) %}
        {% for key in ledger['done'] %}
          {% if key in scan.current and key not in ns.kept %}
            {% set ns.kept = ns.kept + [key] %}
          {% endif %}
        {% endfor %}
        {% set ns.combined = ns.kept %}
        {% for item in scan.due %}
          {% if item.key not in ns.combined %}
            {% set ns.pending = ns.pending + [item] %}
            {% set ns.combined = ns.combined + [item.key] %}
          {% endif %}
        {% endfor %}
        {{ {'kept': ns.kept, 'pending': ns.pending, 'combined': ns.combined} }}
  - if:
      - condition: template
        value_template: >-
          {{ ({'v1': true, 'done': plan.combined} | to_json | length) > 255 }}
    then:
      - service: persistent_notification.create
        data:
          notification_id: simple_timer_card_device_action_warning
          title: "Device timer ledger is full"
          message: >-
            No device actions ran this poll. Current claims plus due actions
            exceed 255 characters. Dismiss finished device timers on the card.
      - stop: "Capacity exceeded; no actions or ledger writes."
  # Remove only absent/changed deadlines. This does not claim new actions.
  - if:
      - condition: template
        value_template: "{{ ledger['done'] != plan.kept }}"
    then:
      - service: input_text.set_value
        target:
          entity_id: "{{ processed_helper }}"
        data:
          value: "{{ {'v1': true, 'done': plan.kept} | to_json }}"
  - repeat:
      for_each: "{{ plan.pending }}"
      sequence:
        - if:
            - condition: template
              value_template: >-
                {% set saved = states(processed_helper) | from_json(default=none) %}
                {% set expected = plan.kept +
                     (plan.pending[:repeat.index - 1] | map(attribute='key') | list) %}
                {{ not (states(sensor_entity) == '1'
                   and state_attr(sensor_entity, 'store_valid') is sameas true
                   and state_attr(sensor_entity, 'lastUpdated') == snapshot_updated
                   and state_attr(sensor_entity, 'timers') == records
                   and saved is mapping and saved.get('v1') is sameas true
                   and saved.get('done') == expected) }}
          then:
            - stop: "Store or ledger changed; recheck on the next poll."
        # homeassistant.turn_on/turn_off/toggle work across entity domains.
        - service: "homeassistant.{{ repeat.item.service }}"
          target:
            entity_id: "{{ repeat.item.entity_id }}"
        # Claim only after the action returns without error.
        - service: input_text.set_value
          target:
            entity_id: "{{ processed_helper }}"
          data:
            value: >-
              {{ {'v1': true, 'done': plan.kept +
                  (plan.pending[:repeat.index] | map(attribute='key') | list)} | to_json }}
mode: single
max_exceeded: silent
